name: Autograding

on:
  push:
  workflow_dispatch:

jobs:
  autograding:
    name: Autograding
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'einde examen')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install autograding dependencies
        run: npm ci --prefix .github/autograding

      - name: Run autograding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/autograding/index.js

name: Docker build

on:
  workflow_dispatch:
  
  push:
    branches: [main]

jobs:
  build:                            
    runs-on: ubuntu-latest          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/olenasangare/pe-github-actions-SanHell-82:${{ github.sha }}

    
      - name: Altijd uitvoeren
        if: always()
        run: |
          echo "TEKST-UIT-OPDRACHT"
